bsolute;left:25px;top:22px;z-index:2;text-shadow:0 2px 9px #152334}.scene-title h1{margin:0;font-size:31px}.scene-title p{margin:7px 0;color:#e2eef7;font-size:13px}.scene-hero{position:absolute;bottom:4px;right:12%;font-size:140px;filter:drop-shadow(0 20px 15px #071b2b99);line-height:1.1}.eyebrow{font-size:11px;color:#b8d4e6;letter-spacing:2px;text-transform:uppercase}.heading{font-size:20px;font-weight:800;margin:4px 0 15px}.muted{color:#a2b6ca;font-size:13px;line-height:1.7}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:1px solid #526b86;background:linear-gradient(140deg,#233d56,#1a3049);color:#f3f8ff;border-radius:12px;padding:13px 12px;text-align:left;transition:.16s}.btn:hover:not(:disabled){transform:translateY(-2px);border-color:#93c8d5;background:#2b4c68}.btn b{display:block;font-size:14px}.btn small{display:block;color:#9cb5ca;font-size:11px;margin-top:4px}.btn.primary{background:linear-gradient(120deg,#bfa263,#8c6742);border-color:#e4c38a;color:#171e2a;font-weight:800;text-align:center}.btn.primary small{color:#3f3a30}.btn.ghost{text-align:center}.aside-head{display:flex;justify-content:space-between;align-items:center}.creature-card{display:flex;gap:11px;align-items:center;padding:12px;border-radius:13px;background:#1e3147;border:1px solid #40556b;margin:9px 0}.avatar{font-size:39px;min-width:54px;text-align:center;filter:drop-shadow(0 4px 4px #0006)}.meter{height:7px;border-radius:99px;background:#071526;overflow:hidden;margin-top:7px}.meter>div{height:100%;background:linear-gradient(90deg,#4bbd91,#b1e9a3);transition:width .25s}.xp>div{background:#65a8e5}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{background:#1b2e44;color:#a7bbd0;border:1px solid #37516a;padding:9px 13px;border-radius:10px}.tab.active{background:#bfa263;color:#17202b;border-color:#d8b97b;font-weight:800}.log{background:#0b1929;border-radius:12px;padding:12px;max-height:180px;overflow:auto;font-size:12px;line-height:1.85;color:#c4d6e7}.log div{border-bottom:1px solid #ffffff0a;padding:3px 0}.mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.maptile{min-height:155px;border-radius:15px;border:1px solid #7d9da488;padding:15px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:white;text-shadow:0 2px 6px #10222e;background:linear-gradient(145deg,#79bda5,#1d5a55)}.maptile:nth-child(2){background:linear-gradient(145deg,#698c87,#193d3c)}.maptile:nth-child(3){background:linear-gradient(145deg,#d1a879,#6d5848)}.maptile b{font-size:18px}.maptile small{font-size:11px}.maptile:disabled{filter:grayscale(.8)}.battle{background:linear-gradient(#527b9b,#91b7ad 52%,#638d73 53%,#3a695b);min-height:370px;position:relative;overflow:hidden}.battle.forest{background:linear-gradient(#314e5d,#638b82 52%,#37695b 53%,#234839)}.battle.rock{background:linear-gradient(#a28d7e,#d7b28c 52%,#917960 53%,#675847)}.battleground{position:absolute;bottom:20px;left:5%;width:90%;height:85px;border-radius:50%;background:#163a3d66;transform:perspective(200px) rotateX(55deg)}.fighter{position:absolute;font-size:130px;line-height:1;filter:drop-shadow(0 15px 10px #0005);animation:float 3s ease-in-out infinite}.fighter.player{left:14%;bottom:32px;transform:scaleX(-1)}.fighter.enemy{right:13%;top:56px;font-size:115px;animation-delay:-1s}.battle-hud{position:absolute;z-index:2;background:#0b1b2cd9;border:1px solid #8faab777;border-radius:12px;padding:11px;width:190px;font-size:12px}.battle-hud.enemy{top:18px;left:18px}.battle-hud.player{right:18px;bottom:14px}.battle-hud b{font-size:13px}.battle-controls{padding:15px;background:#101f30}.battle-msg{color:#f2e5c9;margin-bottom:12px;font-size:13px}.skillgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.skill{padding:11px;border-radius:11px;background:#233e58;border:1px solid #57708b;color:#eaf4ff;text-align:left}.skill b{display:block}.skill small{font-size:11px;color:#a5c0d6}.battle-tools{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.battle-tools button{padding:8px 13px;border-radius:8px;border:1px solid #4a667f;background:#152c43;color:#dceaf6}.overlay{position:fixed;inset:0;background:#020911df;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.modal{max-width:750px;width:100%;max-height:90vh;overflow:auto;background:#15273a;border:1px solid #668099;border-radius:22px;padding:25px;box-shadow:0 20px 90px #0009}.startergrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.starter{padding:20px 12px;border:1px solid #506e85;border-radius:15px;background:#1b3247;color:white;text-align:center}.starter:hover{border-color:#e4c184}.starter .big{font-size:75px}.starter b{display:block;margin:8px}.input{padding:13px;background:#0d1b2c;color:white;border:1px solid #55708a;border-radius:10px;width:100%;font:inherit;margin:9px 0 16px}.notification{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#e4c58a;color:#17202a;border-radius:12px;padding:13px 18px;z-index:20;font-weight:800;box-shadow:0 9px 25px #0008;max-width:90%;text-align:center}.footer{margin-top:20px;text-align:center;color:#73899e;font-size:11px}@keyframes float{50%{translate:0 -9px}}@media(max-width:800px){.shell{padding:13px 13px 100px}.layout{grid-template-columns:1fr}.scene{min-height:290px}.scene-hero{font-size:100px;right:6%}.mapgrid{grid-template-columns:1fr}.maptile{min-height:100px}.startergrid{grid-template-columns:1fr}.starter{display:flex;align-items:center;text-align:left}.starter .big{font-size:47px}.fighter{font-size:91px}.fighter.enemy{font-size:83px;right:8%}.fighter.player{left:7%}.battle-hud{width:145px}.top{align-items:start}.brand{font-size:17px}.resources{justify-content:end}.pill{padding:5px 8px}.panel.pad{padding:14px}}
</style></head><body><div id="app"></div><script>
const SPEC={fox:{name:'焰尾狐',icon:'🦊',type:'火',base:[43,22,17,29,20,28],moves:['火苗','爪擊','凝神','迅捷步伐'],evolve:'赤焰靈狐'},lizard:{name:'潮靈蜥',icon:'🦎',type:'水',base:[49,23,23,25,24,20],moves:['水彈','尾擊','水幕','潮汐回復'],evolve:'湧潮靈蜥'},deer:{name:'青芽鹿',icon:'🦌',type:'木',base:[53,19,25,24,28,19],moves:['藤鞭','撞擊','青草療癒','自然守護'],evolve:'翠角靈鹿'},rabbit:{name:'葉芽兔',icon:'🐇',type:'木',base:[37,21,16,17,17,30],moves:['撞擊','藤鞭','凝神','迅捷步伐']},bubble:{name:'水泡獸',icon:'🦭',type:'水',base:[45,17,22,23,23,19],moves:['水彈','撞擊','水幕','潮汐回復']},butterfly:{name:'風靈蝶',icon:'🦋',type:'風',base:[32,15,16,27,21,34],moves:['風刃','撞擊','凝神','迅捷步伐']},mouse:{name:'煙霧鼠',icon:'🐀',type:'毒',base:[40,22,19,22,19,28],moves:['毒針','撞擊','凝神','迅捷步伐']},turtle:{name:'岩甲龜',icon:'🐢',type:'岩',base:[58,24,35,15,29,11],moves:['落石','撞擊','自然守護','凝神']},bird:{name:'炎羽鳥',icon:'🦜',type:'火',base:[38,21,16,27,19,33],moves:['火苗','風刃','凝神','迅捷步伐']},cat:{name:'雷紋貓',icon:'🐈',type:'雷',base:[42,24,17,27,18,36],moves:['電光','爪擊','凝神','迅捷步伐']},shadow:{name:'暗影狐',icon:'🐺',type:'暗',base:[42,24,18,30,21,34],moves:['影襲','爪擊','凝神','迅捷步伐']}};
const MOVES={'火苗':{t:'火',p:43,pp:25,k:'s'},'爪擊':{t:'無',p:40,pp:30,k:'a'},'凝神':{t:'無',p:0,pp:15,k:'buff'},'迅捷步伐':{t:'無',p:0,pp:15,k:'speed'},'水彈':{t:'水',p:43,pp:25,k:'s'},'尾擊':{t:'無',p:42,pp:30,k:'a'},'水幕':{t:'水',p:0,pp:15,k:'heal'},'潮汐回復':{t:'水',p:0,pp:10,k:'heal'},'藤鞭':{t:'木',p:43,pp:25,k:'a'},'撞擊':{t:'無',p:40,pp:30,k:'a'},'青草療癒':{t:'木',p:0,pp:10,k:'heal'},'自然守護':{t:'木',p:0,pp:15,k:'buff'},'風刃':{t:'風',p:45,pp:25,k:'s'},'毒針':{t:'毒',p:40,pp:25,k:'a'},'落石':{t:'岩',p:49,pp:20,k:'a'},'電光':{t:'雷',p:46,pp:25,k:'s'},'影襲':{t:'暗',p:48,pp:20,k:'s'}};
const REGIONS={meadow:{name:'晨曦草原',lv:[2,8],pool:['rabbit','rabbit','bubble','butterfly','cat'],desc:'青草與微風交會之地，適合新手訓練家。',icon:'🌿'},forest:{name:'迷霧林地',lv:[7,14],pool:['mouse','mouse','rabbit','butterfly','shadow'],desc:'森林深處出現異常能量，夜晚尤其神秘。',icon:'🌲'},rock:{name:'岩石丘陵',lv:[10,16],pool:['turtle','turtle','bird','cat'],desc:'山岩間棲息著耐力驚人的精靈。',icon:'⛰️'}};
const QUAL=['D','C','B','A','S'],QVAL={D:.85,C:1,B:1.15,A:1.3,S:1.5};const TYPE={火:['木','冰'],水:['火','岩'],木:['水','岩'],雷:['水','風'],岩:['火','雷'],毒:['木','光'],風:['毒','暗'],冰:['風','雷'],暗:['毒','光'],光:['暗','冰']};
let s,view='home',battle=null,modal='',toastTimer=null;const KEY='spirit-era-v3-playable';function fresh(){return {name:'',avatar:'🧑',party:[],storage:[],coins:600,sp:0,balls:7,potions:4,region:'meadow',hour:9,explores:0,wins:0,catches:0,breakthrough:false,forest:false,rock:false,boss:false,logs:['歡迎來到艾瑟蘭大陸。'],savedAt:Date.now()}}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.party&&x.logs?x:fresh()}catch{return fresh()}}s=load();function save(){s.savedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(s))}function notify(msg){let x=document.querySelector('.notification');if(x)x.remove();x=document.createElement('div');x.className='notification';x.textContent=msg;document.body.append(x);clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.remove(),2800)}function log(msg){s.logs.unshift(msg);s.logs=s.logs.slice(0,35)}function rollQ(){let r=Math.random()*100;return r<.5?'S':r<8?'A':r<28?'B':r<60?'C':'D'}function make(id,lv,q=rollQ()){let x=SPEC[id];let c={id,uid:Date.now().toString(36)+Math.random().toString(36).slice(2,7),lv,xp:0,q,iv:Math.floor(Math.random()*11),shiny:Math.random()<1/500,bond:1,moves:x.moves.slice(0,4),pp:x.moves.slice(0,4).map(n=>MOVES[n].pp),mastery:[0,0,0,0],evolved:false};c.hp=maxhp(c);return c}function stat(c,i){let b=SPEC[c.id].base[i];return Math.floor((b+c.lv*2+c.iv)*QVAL[c.q])}function maxhp(c){return Math.floor((SPEC[c.id].base[0]+c.lv*4+c.iv)*QVAL[c.q])}function alive(){return s.party.find(c=>c.hp>0)}function active(){return s.party[0]}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function short(c){return `${SPEC[c.id].name}${c.shiny?' ✨':''}`}function card(c,idx,controls=false){let h=maxhp(c);return `<div class="creature-card"><div class="avatar">${SPEC[c.id].icon}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:7px"><b>${short(c)}</b><span class="pill" style="padding:2px 8px">${c.q} 級</span></div><div class="muted">Lv.${c.lv} · ${SPEC[c.id].type} · 羈絆 ${c.bond}</div><div class="meter"><div style="width:${Math.max(0,c.hp/h*100)}%"></div></div><div class="muted">HP ${c.hp}/${h}　經驗 ${c.xp}/${c.lv*16}</div>${controls?`<div style="display:flex;gap:5px;margin-top:8px"><button class="tab" onclick="detail(${idx})">詳情</button>${idx>0?`<button class="tab" onclick="lead(${idx})">設為首位</button>`:''}</div>`:''}</div></div>`}function frame(content){document.getElementById('app').innerHTML=`<div class="shell"><header class="top"><div class="brand">✦ 精靈紀元 <small>本 命 修 行 大 師 · PLAYABLE PREVIEW</small></div><div class="resources"><span class="pill">🪙 ${s.coins}</span><span class="pill">✧ ${s.sp} SP</span><span class="pill">◉ ${s.balls} 契約球</span></div></header>${content}<div class="footer">V3.0 玩法試玩原型 · 資料僅儲存在此瀏覽器 · 非第一章正式完成版</div></div>${modal?renderModal():''}`}
function side(){return `<aside class="panel pad"><div class="aside-head"><b>契靈隊伍</b><span class="muted">${s.party.length}/6</span></div>${s.party.map((c,i)=>card(c,i)).join('')||'<p class="muted">尚未選擇本命精靈</p>'}<div class="eyebrow" style="margin-top:17px">冒險紀錄</div><div class="log">${s.logs.slice(0,6).map(x=>`<div>${esc(x)}</div>`).join('')}</div></aside>`}function nav(){return `<div class="tabs">${[['home','🏠 首頁'],['map','🗺️ 探索'],['party','🐾 精靈'],['system','✦ 本命系統'],['shop','🛍️ 商店'],['journal','📜 任務']].map(([v,n])=>`<button class="tab ${view===v?'active':''}" onclick="go('${v}')">${n}</button>`).join('')}</div>`}function go(v){if(battle){notify('請先完成或逃離目前戰鬥');return}view=v;render()}function render(){if(!s.name){modal='start';frame('');return}if(battle){renderBattle();return}let content='';if(view==='home'){content=`<div class="scene ${s.region==='forest'?'forest':s.region==='rock'?'rock':''} ${s.hour>=20||s.hour<5?'night':''}"><div class="hills"></div><div class="scene-title"><div class="eyebrow">艾瑟蘭大陸 · 第一章</div><h1>被遺棄的天賦</h1><p>${esc(s.name)}，你的修行才剛開始。</p></div><div class="scene-hero">${s.avatar} ${SPEC[active().id].icon}</div><div class="glow"></div></div><div class="pad"><div class="eyebrow">主線任務</div><div class="heading">${quest()}</div><p class="muted">${questDesc()}</p><div class="actions"><button class="btn primary" onclick="go('map')">前往世界地圖 →</button><button class="btn ghost" onclick="rest()">🏥 精靈中心 · 免費恢復</button></div></div>`}else if(view==='map'){content=`<div class="pad"><div class="eyebrow">艾瑟蘭大陸 · 地區探索</div><div class="heading">選擇冒險區域</div><p class="muted">遊戲時間 ${String(s.hour).padStart(2,'0')}:00 · ${s.hour>=20||s.hour<5?'夜晚':s.hour<9?'清晨':s.hour<17?'白天':'黃昏'}。每次探索推進一小時。</p><div class="mapgrid">${Object.entries(REGIONS).map(([id,r])=>`<button class="maptile" ${id==='forest'&&!s.forest||id==='rock'&&!s.rock?'disabled':''} onclick="selectRegion('${id}')"><span style="font-size:39px">${r.icon}</span><div><b>${r.name}</b><br><small>Lv.${r.lv.join('–')} · ${id==='forest'&&!s.forest||id==='rock'&&!s.rock?'尚未解鎖':'可探索'}</small></div></button>`).join('')}</div><div style="margin-top:19px;padding:18px;border:1px solid #45617b;border-radius:14px"><div class="heading">${REGIONS[s.region].icon} ${REGIONS[s.region].name}</div><p class="muted">${REGIONS[s.region].desc}</p><div class="actions"><button class="btn primary" onclick="explore()">🌿 自由探索</button><button class="btn" onclick="hunt()"><b>🐾 尋找精靈</b><small>直接觸發野外遭遇</small></button><button class="btn" onclick="gather()"><b>🧺 採集材料</b><small>獲得金幣與系統積分</small></button><button class="btn" onclick="restTime()"><b>🌙 休息至夜晚／白天</b><small>快速切換探索時段</small></button></div></div></div>`}else if(view==='party'){content=`<div class="pad"><div class="eyebrow">精靈管理</div><div class="heading">我的契靈隊伍 (${s.party.length}/6)</div>${s.party.map((c,i)=>card(c,i,true)).join('')}<p class="muted">倉庫：${s.storage.length} 隻精靈</p>${s.storage.map((c,i)=>`<div class="creature-card"><span class="avatar">${SPEC[c.id].icon}</span><div style="flex:1"><b>${short(c)}</b><div class="muted">Lv.${c.lv} · ${c.q} 級</div></div><button class="tab" onclick="withdraw(${i})">加入隊伍</button></div>`).join('')}</div>`}else if(view==='system'){let c=active();content=`<div class="pad"><div class="eyebrow">本命修行大師系統</div><div class="heading">✦ 系統 Lv.${s.boss?2:1} · 經驗 ${s.boss?'5':'3'} 倍</div><p class="muted">資質洞察已開啟。資質突破成功率 100%，並立即重新計算能力。</p>${card(c,0)}<div class="actions"><button class="btn primary" onclick="breakthrough()">資質突破 · ${c.q==='C'?'300 SP':c.q==='D'?'100 SP':'後續階段'}</button><button class="btn" onclick="go('shop')"><b>系統商店</b><small>使用 SP 購買修行資源</small></button></div><p class="muted">第一章可完成 C→B 突破。B→A 需要 Lv.20 與羈絆 Lv.2；A→S 需要 Lv.40 與羈絆 Lv.5。</p></div>`}else if(view==='shop'){content=`<div class="pad"><div class="eyebrow">青木鎮 · 道具商店</div><div class="heading">冒險補給</div><div class="actions"><button class="btn" onclick="buy('ball')"><b>◉ 契約球 ×1</b><small>120 金幣 · 持有 ${s.balls}</small></button><button class="btn" onclick="buy('potion')"><b>🧪 回復藥水 ×1</b><small>90 金幣 · 持有 ${s.potions}</small></button><button class="btn" onclick="buy('sp')"><b>✦ 修行精華</b><small>200 SP · 提升首位精靈羈絆</small></button><button class="btn" onclick="rest()"><b>🏥 免費治療</b><small>恢復所有精靈 HP 與 PP</small></button></div></div>`}else{content=`<div class="pad"><div class="eyebrow">第一章 · 任務日誌</div><div class="heading">${quest()}</div><p class="muted">${questDesc()}</p><div class="creature-card"><div class="avatar">📜</div><div><b>冒險紀錄</b><div class="muted">野外勝利 ${s.wins} 場 · 捕捉 ${s.catches} 隻 · 探索 ${s.explores} 次</div><div class="muted">資質突破：${s.breakthrough?'已完成':'尚未完成'} · 洛恩考核：${s.boss?'已通過':'尚未通過'}</div></div></div>${s.wins>=3&&!s.forest?'<button class="btn primary" onclick="unlockForest()">解鎖迷霧林地</button>':''}${s.forest&&s.wins>=6&&!s.rock?'<button class="btn primary" onclick="unlockRock()">解鎖岩石丘陵</button>':''}${s.rock&&!s.boss?'<button class="btn primary" onclick="bossStart()">⚔️ 挑戰洛恩 · 學院最終考核</button>':''}${s.boss?'<p style="color:#cde6ae">🏆 第一章試玩目標完成！你獲得青木鎮新星稱號。</p>':''}<div class="heading" style="margin-top:22px">歷程</div><div class="log">${s.logs.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>`}frame(`${nav()}<div class="layout"><main class="panel">${content}</main>${side()}</div>`)}
function quest(){return !s.wins?'初次野外修行':s.wins<3?'累積三場勝利':!s.breakthrough?'完成 C→B 資質突破':!s.forest?'探索迷霧林地':!s.rock?'通過岩石丘陵試煉':!s.boss?'擊敗洛恩，成為青木鎮新星':'第一章試玩目標完成'}function questDesc(){return !s.wins?'前往晨曦草原，進行第一次野外戰鬥。':s.wins<3?`目前 ${s.wins}/3 場勝利。每次勝利都能獲得經驗、金幣與 SP。`:!s.breakthrough?'打開本命系統，將 C 級初始精靈提升至 B 級（需 Lv.10 與 300 SP）。':!s.forest?'前往任務日誌解鎖迷霧林地。':!s.rock?'累積六場勝利，前往任務日誌解鎖岩石丘陵。':!s.boss?'在任務日誌挑戰洛恩的三隻精靈。':'你已完成本次可玩原型的主要目標，仍可繼續捕捉與修行。'}function selectRegion(id){s.region=id;log('抵達'+REGIONS[id].name);save();render()}function advance(){s.hour=(s.hour+1)%24;s.explores++}function wild(){let pool=REGIONS[s.region].pool;let id=pool[Math.floor(Math.random()*pool.length)];if(id==='shadow'&&Math.random()>.15)id='mouse';if(id==='cat'&&s.region==='meadow'&&Math.random()>.25)id='rabbit';let range=REGIONS[s.region].lv;let lv=range[0]+Math.floor(Math.random()*(range[1]-range[0]+1));startBattle([make(id,lv)],false)}function explore(){advance();if(Math.random()<.65){wild();return}let gold=50+Math.floor(Math.random()*80),sp=20+Math.floor(Math.random()*25);s.coins+=gold;s.sp+=sp;log(`探索發現補給：${gold} 金幣、${sp} SP`);save();notify('探索發現補給！');render()}function hunt(){advance();wild()}function gather(){advance();let gold=45+Math.floor(Math.random()*80),sp=25+Math.floor(Math.random()*35);s.coins+=gold;s.sp+=sp;log(`採集獲得 ${gold} 金幣、${sp} SP`);save();notify(`獲得 ${gold} 金幣與 ${sp} SP`);render()}function restTime(){s.hour=s.hour>=20||s.hour<5?9:21;save();render()}function rest(){s.party.concat(s.storage).forEach(c=>{c.hp=maxhp(c);c.pp=c.moves.map(n=>MOVES[n].pp)});log('精靈中心恢復了全部精靈');save();notify('精靈已完全恢復');render()}function buy(t){if(t==='sp'){if(s.sp<200)return notify('SP 不足');s.sp-=200;active().bond=Math.min(10,active().bond+1)}else{let price=t==='ball'?120:90;if(s.coins<price)return notify('金幣不足');s.coins-=price;if(t==='ball')s.balls++;else s.potions++}save();render()}function lead(i){s.party.unshift(s.party.splice(i,1)[0]);save();render()}function withdraw(i){if(s.party.length>=6)return notify('隊伍已滿');s.party.push(s.storage.splice(i,1)[0]);save();render()}function detail(i){let c=s.party[i];modal='detail:'+i;render()}function breakthrough(){let c=active();if(c.q!=='C'&&c.q!=='D')return notify('更高階突破將在後續等級解鎖');let cost=c.q==='C'?300:100;if(c.lv<(c.q==='C'?10:5))return notify('等級不足，需要 Lv.'+(c.q==='C'?10:5));if(s.sp<cost)return notify('SP 不足');let ratio=c.hp/maxhp(c);s.sp-=cost;c.q=c.q==='C'?'B':'C';c.hp=Math.max(1,Math.floor(maxhp(c)*ratio));if(c.q==='B')s.breakthrough=true;log(`${short(c)} 資質突破至 ${c.q} 級！`);save();notify('✦ 資質突破成功！');render()}function unlockForest(){s.forest=true;s.region='forest';s.sp+=150;log('迷霧林地已解鎖，獲得 150 SP');save();render()}function unlockRock(){s.rock=true;s.region='rock';s.sp+=250;log('岩石丘陵已解鎖，獲得 250 SP');save();render()}function bossStart(){if(!s.breakthrough)return notify('請先完成本命精靈資質突破');startBattle([make('turtle',11,'B'),make('butterfly',12,'B'),make('cat',13,'A')],true)}
function startBattle(enemies,boss){if(!alive()){notify('所有精靈都失去戰鬥能力，請先治療');return}let idx=s.party.findIndex(c=>c.hp>0);if(idx>0)s.party.unshift(s.party.splice(idx,1)[0]);battle={enemies,enemy:0,boss,turn:1,msg:boss?'洛恩：「讓我看看你的修行究竟有什麼本事！」':'野生精靈出現了！',guard:0,boost:0};modal='';renderBattle()}function enemy(){return battle.enemies[battle.enemy]}function hpbar(c){return `<div class="meter"><div style="width:${Math.max(0,100*c.hp/maxhp(c))}%"></div></div><div style="margin-top:4px;color:#c9d9e8">HP ${Math.max(0,c.hp)}/${maxhp(c)}</div>`}function renderBattle(){let a=active(),e=enemy(),reg=REGIONS[s.region];frame(`<div class="panel"><div class="battle ${s.region==='forest'?'forest':s.region==='rock'?'rock':''}"><div class="battleground"></div><div class="battle-hud enemy"><b>${short(e)}　Lv.${e.lv}</b><div>${e.q} 級 · ${SPEC[e.id].type}</div>${hpbar(e)}</div><div class="fighter enemy">${SPEC[e.id].icon}</div><div class="fighter player">${SPEC[a.id].icon}</div><div class="battle-hud player"><b>${short(a)}　Lv.${a.lv}</b><div>${a.q} 級 · ${SPEC[a.id].type}</div>${hpbar(a)}</div></div><div class="battle-controls"><div class="battle-msg">⚔️ ${esc(battle.msg)} ${battle.boss?`｜洛恩剩餘 ${battle.enemies.length-battle.enemy} 隻`:''}</div><div class="skillgrid">${a.moves.map((n,i)=>`<button class="skill" ${a.pp[i]<=0?'disabled':''} onclick="useMove(${i})"><b>${n}</b><small>${MOVES[n].t} · ${MOVES[n].p?'威力 '+MOVES[n].p:'輔助'} · PP ${a.pp[i]}/${MOVES[n].pp}</small></button>`).join('')}</div><div class="battle-tools"><button onclick="switchModal()">🔄 更換精靈</button><button onclick="potion()">🧪 藥水 (${s.potions})</button>${!battle.boss?`<button onclick="capture()">◉ 捕捉 (${s.balls})</button><button onclick="runAway()">🏃 逃跑</button>`:''}</div></div></div>${modal?renderModal():''}`)}function typeMult(move,def){let attack=MOVES[move].t,dt=SPEC[def.id].type;if(attack==='無')return 1;if((TYPE[attack]||[]).includes(dt))return 1.5;if((TYPE[dt]||[]).includes(attack))return .75;return 1}function strike(att,def,name,player){let m=MOVES[name],k=m.k;if(k==='heal'){let gain=Math.min(maxhp(att)-att.hp,Math.ceil(maxhp(att)*.27));att.hp+=gain;return `${short(att)} 使用${name}，恢復 ${gain} HP！`}if(k==='buff'||k==='speed'){if(player)battle.boost=Math.min(2,battle.boost+1);else battle.guard=Math.min(2,battle.guard+1);return `${short(att)} 使用${name}，提升戰鬥狀態！`}let atk=stat(att,k==='a'?1:3),dfs=stat(def,k==='a'?2:4);let mult=typeMult(name,def),crit=Math.random()<.05;let base=((att.lv/10+2)*atk/Math.max(1,dfs)*(m.p/10));let dmg=Math.max(2,Math.floor(base*mult*(crit?1.5:1)*(m.t===SPEC[att.id].type?1.2:1)*(player?1+battle.boost*.1:1)*(player?1:1-battle.guard*.08)*(.9+Math.random()*.2)));def.hp=Math.max(0,def.hp-dmg);return `${short(att)} 使用${name}，造成 ${dmg} 傷害！${mult>1?'效果絕佳！':mult<1?'效果不佳。':''}${crit?'暴擊！':''}`}function useMove(i){if(!battle)return;let a=active(),e=enemy(),name=a.moves[i];if(a.pp[i]<=0)return;let m=MOVES[name];a.pp[i]--;a.mastery[i]++;let em=e.moves.find(n=>MOVES[n].pp>0)||e.moves[0];let playerSpeed=stat(a,5)+(m.k==='speed'?999:0),enemySpeed=stat(e,5);let msgs=[];if(playerSpeed>=enemySpeed){msgs.push(strike(a,e,name,true));if(e.hp>0)msgs.push(strike(e,a,em,false))}else{msgs.push(strike(e,a,em,false));if(a.hp>0)msgs.push(strike(a,e,name,true))}battle.msg=msgs.join(' ');afterTurn()}function afterTurn(){if(enemy().hp<=0){let e=enemy();let gain=Math.floor((e.lv*12+20)*(s.boss?1:1)*(s.boss?5:3));s.party.filter(c=>c.hp>0).forEach(c=>{c.xp+=gain;while(c.xp>=c.lv*16&&c.lv<100){c.xp-=c.lv*16;c.lv++;let h=maxhp(c);c.hp=Math.min(h,c.hp+15);log(`${short(c)} 升到 Lv.${c.lv}！`)}});s.sp+=s.boss?110:70;s.coins+=s.boss?180:90;s.wins++;battle.enemy++;if(battle.enemy>=battle.enemies.length){if(battle.boss){s.boss=true;s.sp+=1000;log('擊敗洛恩！獲得青木鎮新星稱號，系統升至 Lv.2。')}else log(`戰勝 ${SPEC[e.id].name}，獲得經驗、金幣與 SP`);battle=null;save();notify(s.boss?'🏆 第一章試玩目標完成！':'戰鬥勝利！');view='home';render();return}battle.msg=`${short(e)} 倒下了！洛恩派出 ${short(enemy())}！`}if(active().hp<=0){let idx=s.party.findIndex(c=>c.hp>0);if(idx<0){s.party.forEach(c=>{c.hp=maxhp(c);c.pp=c.moves.map(n=>MOVES[n].pp)});s.coins=Math.max(0,s.coins-60);log('戰敗，返回精靈中心恢復');battle=null;save();notify('戰敗！返回青木鎮');view='home';render();return}s.party.unshift(s.party.splice(idx,1)[0]);battle.msg+=` ${short(active())} 接替上場！`}if(battle){battle.turn++;save();renderBattle()}}function capture(){if(s.balls<=0)return notify('契約球不足');s.balls--;let e=enemy(),chance=Math.min(.93,.20+(1-e.hp/maxhp(e))*.65+(e.q==='S'?-.07:0));if(Math.random()<chance){e.hp=Math.max(1,e.hp);if(s.party.length<6)s.party.push(e);else s.storage.push(e);s.catches++;s.sp+=30;log(`成功捕捉 ${short(e)}（${e.q} 級）`);battle=null;save();notify(`捕捉成功！${short(e)} 加入隊伍`);view='party';render()}else{battle.msg='契約球搖晃了幾下……捕捉失敗！ '+strike(e,active(),e.moves[0],false);afterTurn()}}function potion(){if(s.potions<=0)return notify('藥水不足');let a=active();if(a.hp===maxhp(a))return notify('HP 已滿');s.potions--;let n=Math.min(65,maxhp(a)-a.hp);a.hp+=n;battle.msg=`${short(a)} 恢復 ${n} HP！ `+strike(enemy(),a,enemy().moves[0],false);afterTurn()}function runAway(){battle=null;log('安全離開野外戰鬥');save();view='map';render()}function switchModal(){modal='switch';renderBattle()}function swap(i){if(s.party[i].hp<=0)return notify('無法換上已倒下的精靈');if(i===0)return;let c=s.party.splice(i,1)[0];s.party.unshift(c);modal='';battle.msg=`換上 ${short(c)}！ `+strike(enemy(),c,enemy().moves[0],false);afterTurn()}
function renderModal(){if(modal==='start')return `<div class="overlay"><div class="modal"><div class="eyebrow">艾瑟蘭大陸 · 冒險的起點</div><h1>你的本命修行，即將開始。</h1><p class="muted">在契靈學院的覺醒儀式中，你將與第一隻精靈締結契約。即使牠只有 C 級資質，你也能讓牠成為傳說。</p><label>訓練家名字</label><input id="playername" class="input" placeholder="輸入你的名字" maxlength="12"><div class="tabs"><button class="tab active" id="av0" onclick="chooseAvatar('🧑','av0')">🧑 主角 A</button><button class="tab" id="av1" onclick="chooseAvatar('👩','av1')">👩 主角 B</button></div><div class="heading">選擇你的本命精靈</div><div class="startergrid">${['fox','lizard','deer'].map(id=>`<button class="starter" onclick="begin('${id}')"><div class="big">${SPEC[id].icon}</div><div><b>${SPEC[id].name}</b><small>${SPEC[id].type}屬性 · C級 · Lv.5</small></div></button>`).join('')}</div><p class="muted">試玩資料會自動保存在目前瀏覽器；清除瀏覽器網站資料可能使進度消失。</p></div></div>`;if(modal.startsWith('detail:')){let c=s.party[Number(modal.split(':')[1])];return `<div class="overlay"><div class="modal"><div style="display:flex;justify-content:space-between"><h2>${SPEC[c.id].icon} ${short(c)}</h2><button class="tab" onclick="modal='';render()">關閉 ✕</button></div><p>${c.q} 級 · Lv.${c.lv} · ${SPEC[c.id].type} · 羈絆 Lv.${c.bond} · 個體值 ${c.iv}</p><div class="actions">${['HP','物攻','物防','特攻','特防','速度'].map((n,i)=>`<div class="pill">${n}：${i===0?maxhp(c):stat(c,i)}</div>`).join('')}</div><h3>技能與熟練度</h3>${c.moves.map((n,i)=>`<div class="creature-card">${n}　·　PP ${c.pp[i]}/${MOVES[n].pp}　·　使用 ${c.mastery[i]} 次</div>`).join('')}<p class="muted">進化、完整技能熟練度加成及獨立天賦頁面將在後續版本實作。</p></div></div>`}if(modal==='switch')return `<div class="overlay"><div class="modal"><h2>更換精靈</h2>${s.party.map((c,i)=>`<button class="btn" style="display:block;width:100%;margin:8px 0" ${!c.hp||!i?'disabled':''} onclick="swap(${i})">${SPEC[c.id].icon} ${short(c)} · Lv.${c.lv} · HP ${c.hp}/${maxhp(c)}</button>`).join('')}<button class="tab" onclick="modal='';renderBattle()">返回戰鬥</button></div></div>`;return ''}let selectedAvatar='🧑';function chooseAvatar(v,id){selectedAvatar=v;document.querySelectorAll('#av0,#av1').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}function begin(id){let name=document.getElementById('playername').value.trim();if(!name)return notify('請先輸入訓練家名字');s=fresh();s.name=name;s.avatar=selectedAvatar;s.party=[make(id,5,'C')];s.sp=120;s.logs=[`與 ${SPEC[id].name} 締結契約，本命系統覺醒！`];modal='';save();view='home';render()}function resetGame(){if(confirm('確定要刪除此瀏覽器的試玩存檔？')){localStorage.removeItem(KEY);s=fresh();view='home';modal='start';render()}}render();</script></body></html>
