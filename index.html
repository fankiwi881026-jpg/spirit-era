<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>精靈紀元：本命修行大師</title><style>
:root{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#f4efff;background:#101326}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#303059,#101326 72%);min-height:100vh}button{font:inherit;cursor:pointer;border:1px solid #8884c2;background:#39365e;color:white;border-radius:12px;padding:10px}button:hover{background:#5b518c}button:disabled{opacity:.4;cursor:not-allowed}.wrap{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.title{font-size:clamp(22px,4vw,34px);font-weight:900;color:#ffe2a5;text-shadow:0 2px 15px #c75d9a}.sub{color:#b8b4d8;font-size:13px}.panel{background:#1d2039ee;border:1px solid #6d638f;border-radius:18px;padding:16px;box-shadow:0 10px 32px #0005}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:14px;margin-top:14px}.map{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;max-width:610px;margin:auto;aspect-ratio:11/9}.tile{display:grid;place-items:center;border-radius:7px;font-size:clamp(15px,2.5vw,30px);background:#477956;position:relative;user-select:none}.tile.grass{background:#3a745b}.tile.path{background:#b6a078}.tile.wall{background:#344e58}.tile.heal{background:#749bc0}.tile.boss{background:#8b5879}.tile.player{outline:3px solid #ffe5a5;z-index:1;box-shadow:0 0 15px #fff9}.tile span{filter:drop-shadow(0 2px 2px #0006)}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.buttons button{flex:1;min-width:90px}.dpad{display:grid;grid-template-columns:repeat(3,50px);justify-content:center;gap:5px;margin-top:10px}.dpad button{padding:10px}.stat{display:flex;justify-content:space-between;gap:8px;margin:9px 0;font-size:14px}.bar{height:9px;background:#49425f;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#5cd39b,#a2f0a0);transition:width .3s}.xp>div{background:linear-gradient(90deg,#8f88f7,#d7a8ff)}.log{min-height:65px;max-height:120px;overflow:auto;font-size:14px;line-height:1.6;color:#eadffc}.muted{color:#bdb7d5}.creature{display:flex;align-items:center;gap:12px;background:#292a49;border:1px solid #5d587e;border-radius:13px;padding:10px;margin:8px 0}.portrait{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;font-size:47px;background:radial-gradient(circle at 40% 30%,#75679f,#282b4a);text-shadow:0 4px 10px #0008;flex-shrink:0}.scene{min-height:220px;display:flex;align-items:center;justify-content:space-around;gap:10px;background:linear-gradient(#454276,#726d9a 58%,#557a77 58%,#354d62);border-radius:16px;margin:10px 0}.scene .portrait{width:110px;height:110px;font-size:70px}.battle-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.battle-actions button{text-align:left}.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:#534a7b;font-size:12px}.overlay{position:fixed;inset:0;background:#0c0d1bdc;z-index:20;display:grid;place-items:center;padding:15px;overflow:auto}.modal{max-width:760px;width:100%;background:#20233f;border:1px solid #8c7cb3;border-radius:24px;padding:22px;box-shadow:0 15px 60px #000a}.starter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.starter{background:#302c50;border:1px solid #7d709d;border-radius:18px;padding:12px;text-align:center}.starter .portrait{margin:0 auto 10px;width:100px;height:100px;font-size:64px}.starter button{width:100%}h2,h3{margin:6px 0 12px}small{color:#c6c0db}.hidden{display:none!important}.tag{font-size:12px;color:#ffe2a5}.foot{font-size:12px;color:#aaa5c7;margin:12px 0}.menu{display:flex;flex-wrap:wrap;gap:6px}.menu button{flex:1;min-width:95px}.notice{color:#fbdca7}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:760px){.layout{grid-template-columns:1fr}.starter-grid{grid-template-columns:1fr}.starter{display:grid;grid-template-columns:90px 1fr;gap:8px;text-align:left;align-items:center}.starter .portrait{width:80px;height:80px;font-size:48px;grid-row:span 3}.map{gap:2px}.tile{border-radius:4px}.scene .portrait{width:85px;height:85px;font-size:55px}.split{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="top"><div><div class="title">✦ 精靈紀元：本命修行大師</div><div class="sub">靈源大陸 · 青木鎮篇｜原創動漫奇幻 RPG V1.0</div></div><div><span class="pill" id="region">青木鎮</span> <span class="pill" id="gold">靈晶 0</span></div></header><main class="layout"><section class="panel"><div id="explore"><h2>🌿 世界探索</h2><p class="sub">WASD／方向鍵移動；走進草叢可能遇到靈獸。🏠 回復生命；🏆 挑戰首領。</p><div id="map" class="map" aria-label="探索地圖"></div><div class="dpad"><span></span><button onclick="move(0,-1)">▲</button><span></span><button onclick="move(-1,0)">◀</button><button onclick="interact()">◎</button><button onclick="move(1,0)">▶</button><span></span><button onclick="move(0,1)">▼</button><span></span></div></div><div id="battle" class="hidden"><h2>⚔️ 靈獸對戰 <span class="pill" id="turnlabel"></span></h2><div class="scene"><div><div class="portrait" id="heroIcon"></div><div id="heroName"></div><div class="bar"><div id="heroHP"></div></div><small id="heroHPTxt"></small></div><div style="font-size:25px">VS</div><div><div class="portrait" id="enemyIcon"></div><div id="enemyName"></div><div class="bar"><div id="enemyHP"></div></div><small id="enemyHPTxt"></small></div></div><div id="battleActions" class="battle-actions"></div><div class="buttons"><button onclick="capture()">🔮 契約捕捉（<span id="orbs"></span>）</button><button onclick="usePotion()">🧪 回復藥劑（<span id="potions"></span>）</button><button onclick="flee()">🏃 撤退</button></div></div><h3 style="margin-top:18px">📜 冒險紀錄</h3><div class="log" id="log" aria-live="polite"></div></section><aside class="panel"><div class="menu"><button onclick="setTab('team')">靈獸隊伍</button><button onclick="setTab('cultivate')">修行系統</button><button onclick="setTab('quests')">任務</button></div><div id="sidebar" style="margin-top:16px"></div><div class="buttons"><button onclick="save(true)">💾 儲存</button><button onclick="resetGame()">重新開始</button></div></aside></main><div class="foot">遊戲自動儲存在目前瀏覽器。此版本使用原創設定與圖示佔位，日後可替換成完整日系動漫角色立繪。</div></div><div class="overlay hidden" id="startOverlay"><div class="modal"><h2>✨ 本命契約覺醒</h2><p>你來到了靈源大陸。從三位夥伴中選擇你的本命靈獸，解鎖只有你擁有的修行大師系統！</p><div class="starter-grid" id="starters"></div></div></div><script>
'use strict';
const TYPES={火:{木:1.5,水:.7},水:{火:1.5,木:.7},木:{水:1.5,火:.7},毒:{木:1.5,岩:.7},岩:{火:1.5,水:.7},風:{毒:1.5,岩:.7}};
const SPECIES=[{id:'fox',name:'焰尾狐',icon:'🦊',type:'火',hp:64,atk:17,def:10,spd:16,moves:[['火花',17,'火'],['爪擊',13,'普'],['灼熱吐息',22,'火'],['凝神',0,'輔']]},{id:'salamander',name:'潮靈蜥',icon:'🦎',type:'水',hp:78,atk:14,def:15,spd:11,moves:[['水彈',17,'水'],['尾擊',13,'普'],['潮汐衝擊',22,'水'],['凝神',0,'輔']]},{id:'deer',name:'青芽鹿',icon:'🦌',type:'木',hp:72,atk:14,def:13,spd:13,moves:[['葉刃',17,'木'],['角擊',13,'普'],['藤蔓束縛',21,'木'],['凝神',0,'輔']]},{id:'moth',name:'霧羽蛾',icon:'🦋',type:'毒',hp:61,atk:16,def:10,spd:17,moves:[['毒粉',15,'毒'],['拍擊',13,'普'],['毒霧',20,'毒'],['凝神',0,'輔']]},{id:'rock',name:'礫甲獸',icon:'🦔',type:'岩',hp:86,atk:15,def:18,spd:8,moves:[['落石',17,'岩'],['衝撞',13,'普'],['岩崩',22,'岩'],['凝神',0,'輔']]},{id:'bird',name:'嵐羽雀',icon:'🐦',type:'風',hp:59,atk:17,def:9,spd:19,moves:[['風刃',17,'風'],['啄擊',13,'普'],['疾風斬',22,'風'],['凝神',0,'輔']]}];
const MAP=['###########','#..gg...gB#','#.gg..gg..#','#...g...g.#','#g..##.g..#','#..g...gg.#','#.g..H....#','#....g.g..#','###########'];
const $=id=>document.getElementById(id);let state=null,tab='team',battle=null,busy=false;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const sp=id=>SPECIES.find(s=>s.id===id);const maxhp=c=>sp(c.id).hp+(c.level-1)*5+(c.quality-1)*4;const power=c=>sp(c.id).atk+(c.level-1)*2+(c.quality-1)*2;const defense=c=>sp(c.id).def+(c.level-1)+(c.quality-1);const speed=c=>sp(c.id).spd+(c.level-1);const grade=q=>['','普通','優秀','精英','道館','天王','冠軍','神話'][q]||'神話';const active=()=>state.team[state.active];
function create(id,level=5,quality=1){const c={uid:Math.random().toString(36).slice(2),id,level,quality,xp:0,hp:1,mastery:[0,0,0,0],buff:0,poison:0};c.hp=maxhp(c);return c}
function newGame(id){state={x:2,y:6,team:[create(id)],active:0,coins:100,orbs:5,potions:3,points:30,wins:0,captures:0,boss:false,steps:0,logs:['✨ 本命修行大師系統啟動！修行經驗獲得 3 倍。','📜 任務：擊敗 3 隻野生靈獸，挑戰北方首領。']};$('startOverlay').classList.add('hidden');render();save()}
function log(msg){state.logs.unshift(msg);state.logs=state.logs.slice(0,30);$('log').innerHTML=state.logs.map(x=>'<div>'+escapeHtml(x)+'</div>').join('')}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(notify=false){if(state){localStorage.setItem('spirit-era-v1',JSON.stringify(state));if(notify){log('💾 遊戲已儲存。')}}}
function init(){try{const s=JSON.parse(localStorage.getItem('spirit-era-v1'));if(s&&Array.isArray(s.team)&&s.team.length){state=s;state.active=clamp(state.active||0,0,state.team.length-1);state.logs=state.logs||[];state.team.forEach(c=>{c.mastery=c.mastery||[0,0,0,0];c.buff=c.buff||0;c.poison=c.poison||0;c.hp=clamp(c.hp,0,maxhp(c))});render();log('歡迎回到靈源大陸！');return}}catch(e){}$('startOverlay').classList.remove('hidden');$('starters').innerHTML=SPECIES.slice(0,3).map(s=>`<div class="starter"><div class="portrait">${s.icon}</div><b>${s.name}</b><div class="tag">${s.type}系 · ${s.id==='fox'?'高速輸出':s.id==='salamander'?'堅韌防禦':'治療控制'}</div><button onclick="newGame('${s.id}')">締結契約</button></div>`).join('')}
function move(dx,dy){if(!state||battle||busy)return;let x=state.x+dx,y=state.y+dy;if(!MAP[y]||!MAP[y][x]||MAP[y][x]==='#')return;state.x=x;state.y=y;state.steps++;const tile=MAP[y][x];if(tile==='H'){state.team.forEach(c=>{c.hp=maxhp(c);c.poison=0});log('🏠 靈源驛站：所有靈獸已恢復生命！')}else if(tile==='B'){if(!state.boss)startBattle('rock',9,true);else log('🏆 你已擊敗本區域首領！')}else if(tile==='g'&&Math.random()<.26){const pool=['moth','rock','bird','fox','salamander','deer'];startBattle(pool[rnd(0,pool.length-1)],rnd(3,7),false)}else if(state.steps%9===0){state.points+=5;log('🌟 探索獎勵：修行點數 +5。')}render();save()}
function interact(){if(!state||battle)return;const t=MAP[state.y][state.x];if(t==='H'){state.team.forEach(c=>c.hp=maxhp(c));log('靈獸全部回復。')}else if(t==='B'&&!state.boss)startBattle('rock',9,true);else log('探索中：前往草叢尋找野生靈獸。');render();save()}
function startBattle(id,level,isBoss){const idx=state.team.findIndex(c=>c.hp>0);if(idx<0){state.team.forEach(c=>c.hp=maxhp(c));log('⚕️ 全隊失去戰鬥能力，已自動送回驛站。');state.x=5;state.y=6;return}state.active=idx;const enemy=create(id,level,isBoss?4:rnd(1,3));battle={enemy,boss:isBoss,turn:1,locked:false};active().buff=0;log((isBoss?'🏆 首領挑戰：':'🌿 野生靈獸出現：')+sp(id).name+' Lv.'+level);render()}
function damage(att,def,move){const mult=(TYPES[move[2]]||{})[sp(def.id).type]||1;const base=Math.max(2,Math.floor((move[1]+power(att)*.8-defense(def)*.45)*(0.85+Math.random()*.3)*mult*(1+(att.buff||0)*.25)));return {value:base,mult}}
function attack(i){if(!battle||battle.locked)return;const a=active(),e=battle.enemy;if(a.hp<=0)return;const m=sp(a.id).moves[i];battle.locked=true;const playerFirst=speed(a)>=speed(e);if(playerFirst){strike(a,e,m,true,i);if(e.hp>0)enemyTurn()}else{enemyTurn();if(a.hp>0)strike(a,e,m,true,i)}finishRound();battle.locked=false;render();save()}
function strike(a,d,m,isPlayer,i){if(m[2]==='輔'){a.buff=Math.min(3,(a.buff||0)+1);log(`${sp(a.id).name} 使用凝神，攻擊力提升！`);return}const hit=damage(a,d,m);d.hp=Math.max(0,d.hp-hit.value);if(isPlayer){a.mastery[i]=(a.mastery[i]||0)+1}log(`${sp(a.id).name} 使用${m[0]}，造成 ${hit.value} 傷害${hit.mult>1?'（效果絕佳）':hit.mult<1?'（效果不佳）':''}！`);if(m[2]==='毒'&&Math.random()<.25){d.poison=3;log(`${sp(d.id).name} 中毒了！`)}}
function enemyTurn(){const e=battle.enemy,a=active();if(e.hp<=0)return;const options=sp(e.id).moves;const i=rnd(0,2);strike(e,a,options[i],false,i)}
function finishRound(){if(!battle)return;const a=active(),e=battle.enemy;for(const c of [a,e]){if(c.hp>0&&c.poison>0){const d=Math.max(1,Math.floor(maxhp(c)*.07));c.hp=Math.max(0,c.hp-d);c.poison--;log(`${sp(c.id).name} 受到 ${d} 點中毒傷害。`)}}if(e.hp<=0){victory();return}if(a.hp<=0){log(`${sp(a.id).name} 失去戰鬥能力！`);const idx=state.team.findIndex(c=>c.hp>0);if(idx<0){battle=null;state.x=5;state.y=6;state.team.forEach(c=>{c.hp=Math.max(1,Math.floor(maxhp(c)*.5));c.poison=0});log('⚕️ 全隊倒下，已送回驛站恢復部分生命。')}else{state.active=idx;log(`換上 ${sp(active().id).name}！`)}}if(battle)battle.turn++}
function victory(){const e=battle.enemy,a=active();const gain=e.level*9*3;const coins=e.level*4;const points=e.level*3;state.wins++;state.coins+=coins;state.points+=points;log(`🏅 勝利！經驗 +${gain}（系統 3 倍）、靈晶 +${coins}、修行點 +${points}。`);gainXp(a,gain);if(battle.boss){state.boss=true;state.points+=80;state.orbs+=3;log('🏆 首領擊敗！第一章通關！額外獲得 80 修行點與 3 顆契約晶球。')}battle=null}
function gainXp(c,n){c.xp+=n;while(c.xp>=c.level*24){c.xp-=c.level*24;c.level++;c.hp=maxhp(c);log(`✨ ${sp(c.id).name} 升至 Lv.${c.level}！生命完全恢復。`)}}
function capture(){if(!battle||battle.boss){if(battle)log('首領靈獸無法捕捉。');return}if(state.orbs<=0){log('契約晶球不足！');return}if(state.team.length>=6){log('隊伍已滿 6 隻，無法捕捉。');return}state.orbs--;const e=battle.enemy;const chance=clamp(.2+(1-e.hp/maxhp(e))*.65,0,.9);if(Math.random()<chance){e.hp=Math.max(1,e.hp);e.poison=0;state.team.push(e);state.captures++;state.points+=15;log(`🔮 契約成功！${sp(e.id).name} 加入隊伍，修行點 +15。`);battle=null}else{log('🔮 契約失敗！野生靈獸掙脫了。');enemyTurn();finishRound()}render();save()}
function usePotion(){if(!battle||state.potions<=0)return;state.potions--;const a=active();a.hp=Math.min(maxhp(a),a.hp+40);log(`${sp(a.id).name} 恢復了生命。`);enemyTurn();finishRound();render();save()}
function flee(){if(!battle)return;if(battle.boss){log('首領戰無法撤退！');return}if(Math.random()<.8){battle=null;log('成功撤退！')}else{log('撤退失敗！');enemyTurn();finishRound()}render();save()}
function setTab(t){tab=t;render()}
function selectCreature(i){if(battle){log('對戰中不可手動切換隊伍。');return}if(state.team[i].hp<=0){log('無法選擇失去戰鬥能力的靈獸。');return}state.active=i;render();save()}
function cultivate(){if(battle){log('戰鬥中無法修行。');return}const c=active();if(state.points<20){log('修行點不足（需要 20 點）。');return}state.points-=20;const gain=45*3;gainXp(c,gain);log(`🧘 ${sp(c.id).name} 完成修行！經驗 +${gain}（3 倍加成）。`);render();save()}
function breakthrough(){if(battle){log('戰鬥中無法突破。');return}const c=active(),cost=c.quality*70;if(c.quality>=7){log('已達神話資質。');return}if(state.points<cost){log(`突破需要 ${cost} 修行點。`);return}state.points-=cost;c.quality++;c.hp=maxhp(c);log(`🌠 資質突破成功！${sp(c.id).name} 已達 ${grade(c.quality)} 資質。`);render();save()}
function buy(item){if(battle){log('戰鬥中無法購買。');return}const cost=item==='orb'?35:25;if(state.coins<cost){log('靈晶不足。');return}state.coins-=cost;if(item==='orb')state.orbs++;else state.potions++;log('購買成功！');render();save()}
function resetGame(){if(confirm('確定刪除本機存檔，重新選擇本命靈獸嗎？')){localStorage.removeItem('spirit-era-v1');state=null;battle=null;location.reload()}}
function render(){if(!state)return;$('region').textContent=state.boss?'青木鎮 · 首領已擊敗':'青木鎮 · 冒險中';$('gold').textContent='💎 靈晶 '+state.coins;$('explore').classList.toggle('hidden',!!battle);$('battle').classList.toggle('hidden',!battle);$('map').innerHTML=MAP.map((row,y)=>row.split('').map((t,x)=>{const p=x===state.x&&y===state.y;const css=t==='#'?'wall':t==='g'?'grass':t==='H'?'heal':t==='B'?'boss':'path';return `<div class="tile ${css} ${p?'player':''}" title="${p?'你的位置':t==='g'?'草叢':t==='H'?'回復驛站':t==='B'?'首領':''}"><span>${p?'🧑‍🎤':t==='#'?'🌲':t==='g'?'🌿':t==='H'?'🏠':t==='B'?'🏆':''}</span></div>`}).join('')).join('');if(battle){const a=active(),e=battle.enemy;$('turnlabel').textContent='第 '+battle.turn+' 回合';$('heroIcon').textContent=sp(a.id).icon;$('enemyIcon').textContent=sp(e.id).icon;$('heroName').textContent=sp(a.id).name+' Lv.'+a.level;$('enemyName').textContent=sp(e.id).name+' Lv.'+e.level;$('heroHP').style.width=100*a.hp/maxhp(a)+'%';$('enemyHP').style.width=100*e.hp/maxhp(e)+'%';$('heroHPTxt').textContent=a.hp+'/'+maxhp(a);$('enemyHPTxt').textContent=e.hp+'/'+maxhp(e);$('battleActions').innerHTML=sp(a.id).moves.map((m,i)=>`<button onclick="attack(${i})">${m[0]} <span class="tag">${m[2]} · 熟練 ${a.mastery[i]||0}</span></button>`).join('');$('orbs').textContent=state.orbs;$('potions').textContent=state.potions}
let html='';if(tab==='team'){html='<h3>🐾 靈獸隊伍（'+state.team.length+'/6）</h3>';state.team.forEach((c,i)=>{html+=`<div class="creature"><div class="portrait">${sp(c.id).icon}</div><div style="flex:1;min-width:0"><b>${sp(c.id).name} Lv.${c.level}</b> ${i===0?'<span class="tag">本命</span>':''}<div class="sub">${sp(c.id).type}系 · ${grade(c.quality)}資質</div><div class="bar"><div style="width:${100*c.hp/maxhp(c)}%"></div></div><small>HP ${c.hp}/${maxhp(c)}</small><div class="bar xp"><div style="width:${100*c.xp/(c.level*24)}%"></div></div><small>EXP ${c.xp}/${c.level*24}</small><div><button ${state.active===i?'disabled':''} onclick="selectCreature(${i})">${state.active===i?'出戰中':'設為出戰'}</button></div></div></div>`})}else if(tab==='cultivate'){const c=active();html=`<h3>✨ 本命修行大師</h3><p class="notice">修行效率 ×3 · 資質洞察已啟用</p><div class="stat"><span>修行點數</span><b>${state.points}</b></div><div class="stat"><span>目前修行靈獸</span><b>${sp(c.id).name}</b></div><div class="stat"><span>資質等級</span><b>${grade(c.quality)}</b></div><div class="stat"><span>攻擊 / 防禦 / 速度</span><b>${power(c)} / ${defense(c)} / ${speed(c)}</b></div><div class="buttons"><button onclick="cultivate()">🧘 修行（20 點）</button><button onclick="breakthrough()" ${c.quality>=7?'disabled':''}>🌠 資質突破（${c.quality*70} 點）</button></div><p class="sub">戰鬥勝利獲得 3 倍經驗；修行亦享 3 倍經驗。突破可永久提升資質與能力。</p>`}else{html=`<h3>📖 第一章：青木鎮</h3><p>${state.wins>=3?'✅':'⬜'} 擊敗野生靈獸 3 次（${Math.min(3,state.wins)}/3）</p><p>${state.captures>=1?'✅':'⬜'} 捕捉第一隻野生靈獸</p><p>${state.boss?'✅':'⬜'} 前往地圖右上角挑戰礫甲首領</p><p class="notice">${state.boss?'🎉 第一章通關！可繼續自由探索、修行與收集。':'完成首領挑戰即可通關第一章。'}</p><h3>🛒 補給商店</h3><div class="buttons"><button onclick="buy('orb')">契約晶球 · 35 💎</button><button onclick="buy('potion')">回復藥劑 · 25 💎</button></div><p class="sub">持有：晶球 ${state.orbs}、藥劑 ${state.potions}</p>`}$('sidebar').innerHTML=html;$('log').innerHTML=state.logs.map(x=>'<div>'+escapeHtml(x)+'</div>').join('')}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key)){e.preventDefault();const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')move(0,-1);if(k==='arrowdown'||k==='s')move(0,1);if(k==='arrowleft'||k==='a')move(-1,0);if(k==='arrowright'||k==='d')move(1,0)}});init();
</script></body></html>
